[package]
name = "nvcex-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.4", features = ["trace"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
protobuf-core = "0.2.2"
bytes = "1"
url = "2"
hound = "3.4"
async-recursion = "1"
sha2 = "0.10"
rubato = "0.16"
